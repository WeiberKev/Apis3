<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="container">
        <div class="card p-4 shadow-lg border-0">
            <h1 class="text-center text-uppercase fw-bold text-primary shadow-sm">
                <i class="bi bi-cloud-sun"></i> Consulta clima por ciudad
            </h1>
            
            <div class="card p-4 shadow-sm border-0 mt-4">
                <h2 class="text-center text-primary fw-bold mb-3">
                    <i class="bi bi-cloud-drizzle"></i> Consulta el Clima
                </h2>
                
                <div class="mb-3">
                    <label for="country" class="form-label fw-bold">Seleccione un país:</label>
                    <select class="form-select" id="countrySelect">
                        <option value="CO">Colombia</option>
                        <option value="AR">Argentina</option>
                        <option value="CR">Costa Rica</option>
                        <option value="ES">España</option>
                        <option value="EU">Estados Unidos</option>
                        <option value="PE">Perú</option>
                        <option value="MX">México</option>
                    </select>
                </div>
                
                <div class="input-group mb-3">
                    <span class="input-group-text bg-primary text-white">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" class="form-control form-control-lg" id="exampleFormControlInput1" 
                        placeholder="Digite la ciudad..." aria-label="Ciudad">
                    <button class="btn btn-primary btn-lg" id="searchBtn">Buscar</button>
                </div>
    
                <div class="mb-3 answer text-center text-dark fs-5 fw-semibold"></div>
            </div>
        </div>
    </div>
    <script src="clima.js"></script>
</body>
</html>
