<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Imágenes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .image-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .image-container img {
            width: 200px; /* Ancho fijo */
            height: 200px; /* Alto fijo */
            object-fit: cover; /* Recorta la imagen manteniendo su relación */
            border-radius: 10px;
        }
    </style>
</head>
<head>
    <h1 class="text-center text-primary my-5">Galería imagenes de gatos.</h1>
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center images">

            </div>

</html>
